<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App - Earnings</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { background: #075e54; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; width: 90%; }
        .btn-sec { background: #555; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: #fff; padding: 20px; margin: 15% auto; width: 85%; max-width: 350px; border-radius: 8px; text-align: left; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 4px; }
        .input-group input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>স্বাগতম!</h2>
    <p>ইউজার আইডি: <b id="user-id-display">লোডিং...</b></p>
    <h3>ব্যালেন্স: <span id="user-balance">0</span> টাকা</h3>
    
    <button class="btn" onclick="watchAd()">📺 বিজ্ঞাপন দেখুন (+5 টাকা)</button>
    <button class="btn" style="background: #25d366;" onclick="openWithdrawModal()">💰 উইথড্র করুন</button>
</div>

<!-- Withdraw Popup Modal -->
<div id="withdraw-modal" class="modal">
    <div class="modal-content">
        <h3 style="color: #075e54; text-align: center; margin-top: 0;">উইথড্র রিকোয়েস্ট</h3>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn" style="padding: 5px; font-size: 12px;" onclick="switchMethod('bkash')">bKash</button>
            <button class="btn btn-sec" style="padding: 5px; font-size: 12px;" onclick="switchMethod('nagad')">Nagad</button>
        </div>

        <div id="bkash-info" class="input-group">
            <label>বিকাশ নম্বর (Send Money):</label>
            <input type="text" value="01720236858" readonly style="background: #eee;">
        </div>

        <div id="nagad-info" class="input-group" style="display: none;">
            <label>নগদ নম্বর (Send Money):</label>
            <input type="text" value="01683312033" readonly style="background: #eee;">
        </div>

        <div class="input-group">
            <label>আপনার পেমেন্ট নম্বর:</label>
            <input type="text" id="user-phone" placeholder="017XXXXXXXX">
        </div>

        <div class="input-group">
            <label>টাকার পরিমাণ:</label>
            <input type="number" id="withdraw-amount" placeholder="সর্বনিম্ন ৫০ টাকা">
        </div>

        <button class="btn" onclick="submitWithdraw()">সাবমিট করুন</button>
        <button class="btn btn-sec" onclick="closeModal()">বন্ধ করুন</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLxotImsTTEAMgOfVKdodefhmcTi9MKfE",
        authDomain: "frelancing-mini-app.firebaseapp.com",
        databaseURL: "https://frelancing-mini-app-default-rtdb.firebaseio.com",
        projectId: "frelancing-mini-app",
        storageBucket: "frelancing-mini-app.firebasestorage.app",
        messagingSenderId: "991264241409",
        appId: "1:991264241409:web:466b311d1af170d15c0d00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Get User ID
    let tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
    let currentUser = tgUser ? 'TG_' + tgUser.id : (localStorage.getItem('app_user_id') || 'USER_' + Math.floor(100000 + Math.random() * 900000));
    localStorage.setItem('app_user_id', currentUser);
    document.getElementById('user-id-display').innerText = currentUser;

    let selectedMethod = 'bkash';
    let currentBalance = 0;

    // Realtime User Data Sync
    const userRef = ref(db, 'users/' + currentUser);
    onValue(userRef, (snapshot) => {
        if (snapshot.exists()) {
            currentBalance = snapshot.val().balance || 0;
        } else {
            set(userRef, { userId: currentUser, balance: 0 });
            currentBalance = 0;
        }
        document.getElementById('user-balance').innerText = currentBalance;
    });

    // Watch Ad (+5 Tk)
    window.watchAd = function() {
        let newBalance = currentBalance + 5;
        update(userRef, { balance: newBalance }).then(() => {
            alert("বিজ্ঞাপন দেখার জন্য ৫ টাকা যোগ করা হয়েছে!");
        });
    };

    // Modal Control
    window.openWithdrawModal = () => document.getElementById('withdraw-modal').style.display = 'block';
    window.closeModal = () => document.getElementById('withdraw-modal').style.display = 'none';

    window.switchMethod = function(method) {
        selectedMethod = method;
        if(method === 'bkash') {
            document.getElementById('bkash-info').style.display = 'block';
            document.getElementById('nagad-info').style.display = 'none';
        } else {
            document.getElementById('bkash-info').style.display = 'none';
            document.getElementById('nagad-info').style.display = 'block';
        }
    };

    // Submit Withdraw Request
    window.submitWithdraw = function() {
        const phone = document.getElementById('user-phone').value;
        const amount = Number(document.getElementById('withdraw-amount').value);

        if(!phone || amount <= 0) {
            alert("সঠিক তথ্য দিন!");
            return;
        }
        if(amount > currentBalance) {
            alert("আপনার পর্যাপ্ত ব্যালেন্স নেই!");
            return;
        }

        const reqId = "req_" + Date.now();
        set(ref(db, 'requests/' + reqId), {
            id: reqId,
            userId: currentUser,
            amount: amount,
            method: selectedMethod,
            number: phone,
            type: 'withdraw',
            status: 'pending',
            timestamp: Date.now()
        }).then(() => {
            // Deduct Balance
            update(userRef, { balance: currentBalance - amount });
            alert("উইথড্র রিকোয়েস্ট সফল হয়েছে!");
            closeModal();
        });
    };
</script>
</body>
</html>
